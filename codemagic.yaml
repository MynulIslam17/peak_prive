# Peak Privee iOS workflow. Start it manually from the personal repository
# (MynulIslam17/peak_prive). It uploads a signed IPA for TestFlight processing
# and does not submit the app for App Store review.
#
# submit_to_testflight stays false on purpose:
#   false — internal testers (App Store Connect users) can install after Apple
#           finishes processing the upload. No beta review.
#   true  — also sends the build to TestFlight Beta App Review, which external
#           tester groups need. That is not an App Store release.
# Add beta_groups only when submit_to_testflight is true, using the exact
# group names from App Store Connect.
workflows:
  peak-privee-ios-testflight:
    name: Peak Privee - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic
      # Team settings > Integrations. The key belongs to team 82TK45X459.
      app_store_connect: peak-privee-asc
    environment:
      # These are the reference names in Codemagic > Code signing identities.
      # The certificate is Apple Distribution for team 82TK45X459.
      # The profile is the App Store profile for com.peakprivee.serviceapp.
      # Codemagic does not allow distribution_type or bundle_identifier
      # in the same block as these reference names.
      ios_signing:
        certificates:
          - peak_privee_distribution
        provisioning_profiles:
          - peak_privee_appstore
      vars:
        APP_STORE_APPLE_ID: 6759319535
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Fetch Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build signed iOS release IPA
        script: |
          set -eu
          cd "$CM_BUILD_DIR"

          # Highest build already used on TestFlight or the App Store.
          # A missing build is the only result that starts at zero.
          # An Apple API failure stops the build instead of becoming zero.
          read_latest_build() {
            out=$(mktemp)
            err=$(mktemp)
            set +e
            app-store-connect get-latest-build-number --all-versions "$APP_STORE_APPLE_ID" >"$out" 2>"$err"
            status=$?
            set -e
            raw=$(awk 'NF { line = $0 } END { gsub(/[[:space:]]/, "", line); print line }' "$out")
            if [ "$status" -eq 0 ]; then
              case "$raw" in
                ''|*[!0-9]*)
                  echo "App Store Connect returned a non-numeric build number." >&2
                  cat "$err" >&2
                  printf '%s\n' "$raw" >&2
                  rm -f "$out" "$err"
                  exit 1
                  ;;
              esac
              printf '%s' "$raw"
            elif grep -q "Did not find latest build" "$out" "$err"; then
              case "$raw" in
                ''|*[!0-9]*) printf '0' ;;
                *)
                  echo "App Store Connect reported no build, but also returned a number." >&2
                  rm -f "$out" "$err"
                  exit 1
                  ;;
              esac
            else
              echo "App Store Connect build lookup failed. The build number was not set to 0." >&2
              cat "$err" >&2
              cat "$out" >&2
              rm -f "$out" "$err"
              exit 1
            fi
            rm -f "$out" "$err"
          }

          LATEST_BUILD="$(read_latest_build)"
          BUILD_NUMBER="$((LATEST_BUILD + 1))"
          APP_VERSION="$(awk '/^version:/ { split($2, v, "+"); print v[1]; exit }' pubspec.yaml)"

          echo "Building $APP_VERSION ($BUILD_NUMBER)"

          flutter_build() {
            flutter build ipa --release \
              --build-name="$APP_VERSION" \
              --build-number="$BUILD_NUMBER" \
              --export-options-plist=/Users/builder/export_options.plist \
              "$@"
          }

          case "${STRIPE_PUBLISHABLE_KEY-}" in
            pk_*)
              STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" python3 -c 'import json,os; json.dump({"STRIPE_PUBLISHABLE_KEY": os.environ["STRIPE_PUBLISHABLE_KEY"]}, open("/tmp/stripe_define.json","w"))'
              flutter_build --dart-define-from-file=/tmp/stripe_define.json
              ;;
            *)
              flutter_build
              ;;
          esac
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
