name: harry_service_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  lottie: ^3.1.2
  logger: ^2.6.2
  http: ^1.6.0
  email_validator: ^3.0.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.3.2
  intl: ^0.17.0
  image_picker: ^1.2.1
  mime_type: ^1.0.1
  flutter_stripe: ^12.1.1
  intl_phone_field: ^3.1.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  sliding_up_panel: ^2.0.0
  time_range_picker: ^2.0.0
  cached_network_image: ^3.3.1
  socket_io_client: ^2.0.0
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.1.10

  pdf: ^3.11.1
  path_provider: ^2.1.2
  open_file: ^3.3.2
  connectivity_plus: ^7.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner: ^5.12.0
  build_runner: ^2.4.8
  smooth_page_indicator: ^1.2.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/fonts/pdf/

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true